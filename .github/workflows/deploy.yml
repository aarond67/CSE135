name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy main website
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'hw1/report.html' \
            --exclude 'hw3/test-site/' \
            --exclude 'hw3/collector/' \
            --exclude 'hw3/reporting/' \
            --exclude 'README.md' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:/var/www/baddecisions.site/public_html/"

      - name: Deploy test website
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./hw3/test-site/ \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:/var/www/test.baddecisions.site/public_html/"

      - name: Deploy collector
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./hw3/collector/ \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:/var/www/collector.baddecisions.site/public_html/"